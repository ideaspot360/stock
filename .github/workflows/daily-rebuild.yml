name: Daily Scheduled Jekyll Build

on:
  schedule:
    # 매일 한국 시간(KST) 오전 09:00 (UTC 00:00) 기준으로 cron 발동
    # 이후 워크플로우 내부에서 10~55분 사이 랜덤 지터(Anti-Bot Jitter) 적용
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Anti-bot random jitter delay (10~55min)
        run: |
          # 헌법: 기계적 정각 발행 금지 / 안티봇 랜덤 분(Jitter) 원칙
          # 600~3300초(10분~55분) 사이 랜덤 대기 후 실제 발행: KST 09:10~09:55 사이 랜덤
          DELAY=$((RANDOM % 2701 + 600))
          echo "Anti-bot jitter: waiting ${DELAY} seconds ($(( DELAY / 60 )) min $(( DELAY % 60 )) sec)..."
          sleep $DELAY

      - name: Create empty commit to trigger GitHub Pages build
        run: |
          git commit --allow-empty -m "chore(schedule): trigger daily Jekyll rebuild for $(date '+%Y-%m-%d')"
          git push origin main
