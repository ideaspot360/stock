{% if site.google_adsense_client != "" %}
<div class="ad-slot">
  <!-- Google AdSense Unit -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ site.google_adsense_client }}"
       data-ad-slot="default"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% endif %}
